apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playerpro
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ThilinaMadhushanka/FootBall-App.git
    targetRevision: Azure
    path: deploy/helm/playerpro
    helm:
      valueFiles:
        - ../../environments/lab.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: playerpro
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
