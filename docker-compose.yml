services:
  postgres:
    image: postgres:16-alpine
    container_name: playerpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks:
      - playerpro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    container_name: playerpro-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - playerpro-network
  
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: playerpro-ai-service
    restart: unless-stopped
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_TIMEOUT_SECONDS: "120"
      OLLAMA_MAX_OUTPUT_TOKENS: "256"
    ports:
      - "8000:8000"
    networks:
      - playerpro-network
    depends_on:
      - ollama

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: playerPro
      APP_ENV: Production
      APP_PORT: 8080
      APP_URL: http://localhost

      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 24h

      CORS_ALLOWED_ORIGINS: http://localhost
      UPLOAD_PATH: /app/uploads

      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - playerpro-network
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: playerpro-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - playerpro-network
    ports:
      - "80:80"

networks:
  playerpro-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
  backend_uploads: